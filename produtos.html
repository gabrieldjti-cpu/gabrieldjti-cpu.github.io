<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Meus anúncios | Comércio da Cidade
  </title>


  <!-- ==================================
       CSS DO HEADER
  =================================== -->

  <link
    rel="stylesheet"
    href="components/header.css"
  />


  <!-- ==================================
       FEEDBACK PERSONALIZADO
  =================================== -->

  <link
    rel="stylesheet"
    href="components/feedback.css"
  />


  <!-- ==================================
       CSS DA PÁGINA
  =================================== -->

  <link
    rel="stylesheet"
    href="css/produtos.css"
  />


  <!-- ==================================
       GOOGLE FONTS
  =================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />


  <!-- ==================================
       FONT AWESOME
  =================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

<link rel="stylesheet" href="css/dark-mode.css">
</head>


<body>


  <!-- ==================================
       HEADER
  =================================== -->

  <div id="header"></div>


  <!-- ==================================
       CONTEÚDO
  =================================== -->

  <main class="container">


    <!-- ==================================
         TOPO
    =================================== -->

    <div class="topo">


      <div>

        <h1>

          <i class="fa-solid fa-box"></i>

          Meus anúncios

        </h1>

        <p>
          Acompanhe, edite e marque como indisponíveis os anúncios da sua loja.
        </p>

      </div>


      <a
        href="novo-produto.html"
        class="btn"
      >

        <i class="fa-solid fa-plus"></i>

        Novo anúncio

      </a>

    </div>


    <!-- ==================================
         PESQUISA
    =================================== -->

    <div class="barra-pesquisa">

      <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar anúncio..."
        autocomplete="off"
        aria-label="Pesquisar anúncio"
      />


      <button
        type="button"
        aria-label="Pesquisar"
      >

        <i class="fa-solid fa-magnifying-glass"></i>

      </button>

    </div>


    <!-- ==================================
         LISTA DE PRODUTOS
    =================================== -->

    <div
      id="lista-produtos"
      class="lista-produtos"
      aria-live="polite"
    >


      <!-- ESTADO INICIAL -->

      <div class="sem-produtos">

        <i class="fa-solid fa-box-open"></i>

        <h2>
          Nenhum anúncio ainda.
        </h2>

        <p>

          Clique em

          <strong>
            Novo anúncio
          </strong>

          para publicar o primeiro anúncio da sua loja.

        </p>


        <a
          href="novo-produto.html"
          class="btn"
        >

          <i class="fa-solid fa-plus"></i>

          Criar anúncio

        </a>

      </div>

    </div>

  </main>


  <!-- ==================================
       SCRIPTS
  =================================== -->


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>


  <!-- CONFIGURAÇÃO SUPABASE -->

  <script src="js/supabase.js"></script>
  <script src="js/perfil-pessoal.js"></script>


  <!-- HEADER -->

  <script src="components/header.js"></script>


  <!-- FEEDBACK PERSONALIZADO -->

  <script src="components/feedback.js"></script>


  <!-- PRODUTOS -->

  <script src="js/produtos.js"></script>


</body>

</html>
