<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Produtos | Comércio da Cidade</title>

    <link rel="stylesheet" href="css/produtos.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="components/header.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <div id="header"></div>

    <main class="container">
      <div class="topo">
        <div>
          <h1>
            <i class="fa-solid fa-box"></i>

            Meus Produtos
          </h1>

          <p>Gerencie todos os produtos cadastrados na sua loja.</p>
        </div>

        <a href="novo-produto.html" class="btn">
          <i class="fa-solid fa-plus"></i>

          Novo Produto
        </a>
      </div>

      <div class="barra-pesquisa">
        <input type="text" id="pesquisa" placeholder="Pesquisar produto..." />

        <button>
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div id="lista-produtos" class="lista-produtos">
        <div class="sem-produtos">
          <i class="fa-solid fa-box-open"></i>

          <h2>Nenhum produto cadastrado.</h2>

          <p>
            Clique em <strong>Novo Produto</strong> para cadastrar o primeiro
            produto da sua loja.
          </p>

          <a href="novo-produto.html" class="btn">
            <i class="fa-solid fa-plus"></i>

            Cadastrar Produto
          </a>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
    <script src="components/header.js"></script>

    <script src="js/produtos.js"></script>
  </body>
</html>
