<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="components/header.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Comércio da Cidade</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <div id="header"></div>

    <section class="banner">
      <h1>Encontre tudo o que precisa na sua cidade</h1>

      <p>Compre dos comerciantes locais sem sair de casa.</p>

      <div class="pesquisa">
        <input type="text" id="pesquisa" placeholder="Pesquisar lojas..." />

        <button id="btnPesquisar">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </section>

    <section class="categorias" id="categorias">
      <h2>Categorias</h2>

      <div class="lista-categorias" id="lista-categorias">
        <div class="categoria">🛒 Mercados</div>

        <div class="categoria">💊 Farmácias</div>

        <div class="categoria">🍕 Restaurantes</div>

        <div class="categoria">👕 Roupas</div>

        <div class="categoria">🥩 Açougues</div>

        <div class="categoria">🍞 Padarias</div>
      </div>
    </section>

    <section class="lojas" id="lojas">
      <div class="titulo-lojas">
        <h2>Lojas da Cidade</h2>

        <span id="total-lojas"></span>
      </div>

      <div class="cards" id="lista-lojas">
        <div class="carregando">
          <i class="fa-solid fa-spinner fa-spin"></i>

          <p>Carregando lojas...</p>
        </div>
      </div>
    </section>

    <footer>
      <p>© 2026 Comércio da Cidade - Todos os direitos reservados a Gabriel.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="components/header.js"></script>

    <script src="js/index.js"></script>
  </body>
</html>
