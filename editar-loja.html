<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar Loja | Comércio da Cidade</title>


    <!-- ==============================
         CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="css/editar-loja.css"
    >

    <link
        rel="stylesheet"
        href="components/header.css"
    >


    <!-- ==============================
         GOOGLE FONTS
    =============================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==============================
         FONT AWESOME
    =============================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>


    <!-- ==============================
         HEADER
    =============================== -->

    <div id="header"></div>


    <!-- ==============================
         CONTEÚDO
    =============================== -->

    <main class="container">

        <div class="card">


            <!-- ==============================
                 TÍTULO
            =============================== -->

            <div class="titulo">

                <i class="fa-solid fa-pen-to-square"></i>

                <div>

                    <h1>
                        Editar Loja
                    </h1>

                    <p>
                        Atualize as informações da sua loja.
                    </p>

                </div>

            </div>


            <!-- ==============================
                 FORMULÁRIO
            =============================== -->

            <form id="formEditarLoja">


                <!-- ==============================
                     LOGO
                =============================== -->

                <div class="campo campo-logo">

                    <label for="logo">

                        <i class="fa-solid fa-image"></i>

                        Logo da Loja

                    </label>


                    <!-- ==========================
                         PREVIEW DA LOGO
                    =========================== -->

                    <div class="logo-preview">


                        <!-- LOGO REAL -->

                        <img
                            id="preview-logo"
                            alt="Logo da loja"
                            hidden
                        >


                        <!-- PLACEHOLDER -->

                        <div
                            id="preview-logo-placeholder"
                            class="logo-placeholder"
                        >

                            <i class="fa-solid fa-store"></i>

                        </div>


                    </div>


                    <!-- ==========================
                         INPUT DA LOGO
                    =========================== -->

                    <input
                        type="file"
                        id="logo"
                        accept="image/png,image/jpeg,image/webp"
                    >


                    <small>

                        Escolha uma nova imagem caso
                        queira alterar a logo da loja.

                        <br>

                        Formatos aceitos:
                        JPG, PNG ou WEBP.

                        <br>

                        Máximo de 5 MB.

                    </small>

                </div>


                <!-- ==============================
                     NOME
                =============================== -->

                <div class="campo">

                    <label for="nome">

                        <i class="fa-solid fa-store"></i>

                        Nome da Loja

                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex.: Mercado Boa Compra"
                        required
                    >

                </div>


                <!-- ==============================
                     CATEGORIA
                =============================== -->

                <div class="campo">

                    <label for="categoria">

                        <i class="fa-solid fa-layer-group"></i>

                        Categoria

                    </label>

                    <select
                        id="categoria"
                        required
                    >

                        <option value="">
                            Carregando categorias...
                        </option>

                    </select>

                </div>


                <!-- ==============================
                     TELEFONE / WHATSAPP
                =============================== -->

                <div class="duas-colunas">


                    <!-- TELEFONE -->

                    <div class="campo">

                        <label for="telefone">

                            <i class="fa-solid fa-phone"></i>

                            Telefone

                        </label>

                        <input
                            type="text"
                            id="telefone"
                            placeholder="(33) 99999-9999"
                        >

                    </div>


                    <!-- WHATSAPP -->

                    <div class="campo">

                        <label for="whatsapp">

                            <i class="fa-brands fa-whatsapp"></i>

                            WhatsApp

                        </label>

                        <input
                            type="text"
                            id="whatsapp"
                            placeholder="(33) 99999-9999"
                        >

                    </div>


                </div>


                <!-- ==============================
                     DESCRIÇÃO
                =============================== -->

                <div class="campo">

                    <label for="descricao">

                        <i class="fa-solid fa-align-left"></i>

                        Descrição

                    </label>

                    <textarea
                        id="descricao"
                        rows="4"
                        placeholder="Descreva sua loja..."
                    ></textarea>

                </div>


                <!-- ==============================
                     ENDEREÇO
                =============================== -->

                <div class="campo">

                    <label for="endereco">

                        <i class="fa-solid fa-location-dot"></i>

                        Endereço

                    </label>

                    <input
                        type="text"
                        id="endereco"
                        placeholder="Rua, número"
                    >

                </div>


                <!-- ==============================
                     CIDADE
                =============================== -->

                <div class="campo">

                    <label for="cidade">

                        <i class="fa-solid fa-city"></i>

                        Cidade

                    </label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Sua cidade"
                    >

                </div>


                <!-- ==============================
                     HORÁRIOS
                =============================== -->

                <div class="duas-colunas">


                    <!-- ABERTURA -->

                    <div class="campo">

                        <label for="abertura">

                            <i class="fa-solid fa-clock"></i>

                            Horário de abertura

                        </label>

                        <input
                            type="time"
                            id="abertura"
                        >

                    </div>


                    <!-- FECHAMENTO -->

                    <div class="campo">

                        <label for="fechamento">

                            <i class="fa-solid fa-clock"></i>

                            Horário de fechamento

                        </label>

                        <input
                            type="time"
                            id="fechamento"
                        >

                    </div>


                </div>


                <!-- ==============================
                     STATUS DA LOJA
                =============================== -->

                <div class="campo campo-status">

                    <label for="ativa">

                        <i class="fa-solid fa-toggle-on"></i>

                        Status da Loja

                    </label>

                    <select id="ativa">

                        <option value="true">
                            Loja ativa
                        </option>

                        <option value="false">
                            Loja inativa
                        </option>

                    </select>


                    <small>

                        Lojas inativas não aparecem
                        para os clientes.

                    </small>

                </div>


                <!-- ==============================
                     MENSAGEM
                =============================== -->

                <div
                    id="mensagem"
                    class="mensagem"
                ></div>


                <!-- ==============================
                     BOTÕES
                =============================== -->

                <div class="acoes">


                    <!-- CANCELAR -->

                    <a
                        href="painel-loja.html"
                        class="btn btn-cancelar"
                    >

                        <i class="fa-solid fa-arrow-left"></i>

                        Cancelar

                    </a>


                    <!-- SALVAR -->

                    <button
                        type="submit"
                        class="btn btn-salvar"
                        id="btnSalvar"
                    >

                        <i class="fa-solid fa-floppy-disk"></i>

                        Salvar Alterações

                    </button>


                </div>


            </form>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <p>

            © 2026 Comércio da Cidade -
            Todos os direitos reservados.

        </p>

    </footer>


    <!-- ==============================
         SCRIPTS
    =============================== -->


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- CONFIGURAÇÃO SUPABASE -->

    <script src="js/supabase.js"></script>


    <!-- HEADER -->

    <script src="components/header.js"></script>


    <!-- EDITAR LOJA -->

    <script src="js/editar-loja.js"></script>


</body>

</html>
