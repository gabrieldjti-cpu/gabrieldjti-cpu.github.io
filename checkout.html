<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Checkout | Comércio da Cidade
  </title>


  <!-- ==================================
       CSS
  =================================== -->

  <link
    rel="stylesheet"
    href="components/header.css"
  />

  <link
    rel="stylesheet"
    href="components/feedback.css"
  />

  <link
    rel="stylesheet"
    href="css/checkout.css"
  />


  <!-- ==================================
       GOOGLE FONTS
  =================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />


  <!-- ==================================
       FONT AWESOME
  =================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

</head>


<body>

  <!-- ==================================
       HEADER
  =================================== -->

  <div id="header"></div>


  <!-- ==================================
       CONTEÚDO
  =================================== -->

  <main class="container">

    <div class="topo">

      <h1>

        <i class="fa-solid fa-credit-card"></i>

        Finalizar Pedido

      </h1>

      <p>
        Confira seus dados antes de concluir a compra.
      </p>

    </div>


    <div class="checkout-grid">


      <!-- ==================================
           LADO ESQUERDO
      =================================== -->

      <section>


        <!-- ==================================
             ENDEREÇO DE ENTREGA
        =================================== -->

        <div class="card">

          <h2>

            <i class="fa-solid fa-location-dot"></i>

            Endereço de Entrega

          </h2>


          <div class="linha">

            <div class="campo">

              <label for="nome">
                Nome
              </label>

              <input
                type="text"
                id="nome"
                autocomplete="name"
                placeholder="Seu nome completo"
              />

            </div>


            <div class="campo">

              <label for="telefone">
                Telefone
              </label>

              <input
                type="tel"
                id="telefone"
                autocomplete="tel"
                placeholder="(00) 00000-0000"
              />

            </div>

          </div>


          <div class="campo">

            <label for="endereco">
              Endereço
            </label>

            <input
              type="text"
              id="endereco"
              autocomplete="street-address"
              placeholder="Rua, número, bairro..."
            />

          </div>


          <div class="linha">

            <div class="campo">

              <label for="cidade">
                Cidade
              </label>

              <input
                type="text"
                id="cidade"
                autocomplete="address-level2"
                placeholder="Sua cidade"
              />

            </div>


            <div class="campo">

              <label for="estado">
                Estado
              </label>

              <input
                type="text"
                id="estado"
                autocomplete="address-level1"
                placeholder="UF"
                maxlength="2"
              />

            </div>

          </div>


          <div class="campo">

            <label for="cep">
              CEP
            </label>

            <input
              type="text"
              id="cep"
              autocomplete="postal-code"
              inputmode="numeric"
              placeholder="00000-000"
              maxlength="9"
            />

          </div>

        </div>


        <!-- ==================================
             FORMA DE PAGAMENTO
        =================================== -->

        <div class="card">

          <h2>

            <i class="fa-solid fa-wallet"></i>

            Forma de Pagamento

          </h2>


          <div class="campo">

            <label>

              <input
                type="radio"
                name="pagamento"
                value="pix"
                checked
              />

              PIX

            </label>

          </div>


          <div class="campo">

            <label>

              <input
                type="radio"
                name="pagamento"
                value="credito"
              />

              Cartão de Crédito

            </label>

          </div>


          <div class="campo">

            <label>

              <input
                type="radio"
                name="pagamento"
                value="debito"
              />

              Cartão de Débito

            </label>

          </div>


          <div class="campo">

            <label>

              <input
                type="radio"
                name="pagamento"
                value="dinheiro"
              />

              Dinheiro

            </label>

          </div>


          <!-- TROCO -->

          <div
            id="troco-area"
            style="display: none"
          >

            <div class="campo">

              <label for="troco">
                Troco para
              </label>

              <input
                type="number"
                id="troco"
                min="0"
                step="0.01"
                inputmode="decimal"
                placeholder="Ex.: 100,00"
              />

            </div>

          </div>

        </div>


        <!-- ==================================
             OBSERVAÇÕES
        =================================== -->

        <div class="card">

          <h2>

            <i class="fa-solid fa-comment"></i>

            Observações

          </h2>


          <textarea
            id="observacoes"
            rows="5"
            maxlength="500"
            placeholder="Ex.: tocar campainha, entregar na portaria..."
          ></textarea>

        </div>

      </section>


      <!-- ==================================
           LADO DIREITO
      =================================== -->

      <aside>

        <div class="card resumo">

          <h2>

            <i class="fa-solid fa-cart-shopping"></i>

            Resumo do Pedido

          </h2>


          <!-- PRODUTOS -->

          <div id="lista-checkout">

            <!-- Produtos carregados pelo checkout.js -->

          </div>


          <hr />


          <!-- SUBTOTAL -->

          <div class="linha-resumo">

            <span>
              Subtotal
            </span>

            <strong id="subtotal">
              R$ 0,00
            </strong>

          </div>


          <!-- FRETE -->

          <div class="linha-resumo">

            <span>
              Frete
            </span>

            <strong id="frete">
              Grátis
            </strong>

          </div>


          <hr />


          <!-- TOTAL -->

          <div class="linha-resumo total">

            <span>
              Total
            </span>

            <strong id="total">
              R$ 0,00
            </strong>

          </div>


          <!-- FINALIZAR -->

          <button
            id="btn-finalizar"
            class="btn"
            type="button"
          >

            <i class="fa-solid fa-check"></i>

            Finalizar Pedido

          </button>


          <!-- VOLTAR -->

          <a
            href="carrinho.html"
            class="btn-secundario"
          >

            <i class="fa-solid fa-arrow-left"></i>

            Voltar ao Carrinho

          </a>

        </div>

      </aside>

    </div>

  </main>


  <!-- ==================================
       SCRIPTS
  =================================== -->

  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>

  <script src="js/supabase.js"></script>


  <!-- HEADER -->

  <script src="components/header.js"></script>


  <!-- FEEDBACK PERSONALIZADO -->

  <script src="components/feedback.js"></script>


  <!-- CHECKOUT -->

  <script src="js/checkout.js"></script>

</body>

</html>
