<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Entrar | Comércio da Cidade
    </title>


    <!-- ==============================
         CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="css/login.css"
    >

    <link
        rel="stylesheet"
        href="components/feedback.css"
    >


    <!-- ==============================
         GOOGLE FONTS
    =============================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==============================
         FONT AWESOME
    =============================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>

    <main class="container">

        <div class="login-card">


            <!-- ==============================
                 LOGO
            =============================== -->

            <div class="logo">

                <i class="fa-solid fa-store"></i>

                <h1>
                    Comércio da Cidade
                </h1>

                <p>
                    Entre na sua conta para continuar.
                </p>

            </div>


            <!-- ==============================
                 FORMULÁRIO
            =============================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="toggleSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar ou ocultar senha"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- ==============================
                     OPÇÕES
                =============================== -->

                <div class="opcoes">

                    <label>

                        <input
                            type="checkbox"
                            id="lembrar"
                        >

                        Lembrar de mim

                    </label>


                    <a href="recuperar-senha.html">

                        Esqueci minha senha

                    </a>

                </div>


                <!-- ==============================
                     BOTÃO
                =============================== -->

                <button
                    type="submit"
                    class="btn-login"
                >

                    Entrar

                </button>

            </form>


            <!-- ==============================
                 CADASTRO
            =============================== -->

            <div class="cadastro">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="cadastro.html">

                    Criar Conta

                </a>

            </div>


            <!-- ==============================
                 VOLTAR
            =============================== -->

            <a
                href="index.html"
                class="voltar"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Voltar para o início

            </a>

        </div>

    </main>


    <!-- ==============================
         SCRIPTS
    =============================== -->


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- CONFIGURAÇÃO SUPABASE -->

    <script src="js/supabase.js"></script>


    <!-- FEEDBACK PERSONALIZADO -->

    <script src="components/feedback.js"></script>


    <!-- LOGIN -->

    <script src="js/login.js"></script>

</body>

</html>
