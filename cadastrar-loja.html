<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastrar Loja | Comércio da Cidade</title>

    <!-- CSS DA PÁGINA -->
    <link
        rel="stylesheet"
        href="css/cadastrar-loja.css"
        href="components/feedback.css"
    >

    <!-- CSS DO HEADER -->
    <link
        rel="stylesheet"
        href="components/header.css"
    >

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>


    <!-- ==============================
         CONTEÚDO
    =============================== -->

    <main class="container">

        <div class="card">

            <!-- TÍTULO -->

            <div class="titulo">

                <i class="fa-solid fa-shop"></i>

                <h1>Cadastrar Loja</h1>

            </div>

            <p class="subtitulo">

                Preencha as informações abaixo para começar
                a vender no Comércio da Cidade.

            </p>


            <!-- ==============================
                 FORMULÁRIO
            =============================== -->

            <form id="formLoja">


                <!-- ==============================
                     LOGO DA LOJA
                =============================== -->

                <div class="campo campo-logo">

                    <label for="logo">

                        <i class="fa-solid fa-image"></i>

                        Logo da Loja

                    </label>


                    <!-- PREVIEW -->

                    <div class="logo-preview">

                        <img
                            id="preview-logo"
                            src="img/loja.png"
                            alt="Prévia da logo da loja"
                        >

                    </div>


                    <!-- INPUT -->

                    <input
                        type="file"
                        id="logo"
                        accept="image/png,image/jpeg,image/webp"
                    >


                    <small>

                        Escolha uma imagem para representar
                        sua loja.

                        <br>

                        Formatos aceitos: JPG, PNG ou WEBP.

                    </small>

                </div>


                <!-- ==============================
                     NOME DA LOJA
                =============================== -->

                <div class="campo">

                    <label for="nome">

                        Nome da Loja

                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Ex.: Mercado Boa Compra"
                        required
                    >

                </div>


                <!-- ==============================
                     CATEGORIA
                =============================== -->

                <div class="campo">

                    <label for="categoria">

                        Categoria

                    </label>

                    <select
                        id="categoria"
                        required
                    >

                        <option value="">

                            Carregando categorias...

                        </option>

                    </select>

                </div>


                <!-- ==============================
                     TELEFONE / WHATSAPP
                =============================== -->

                <div class="duas-colunas">


                    <div class="campo">

                        <label for="telefone">

                            Telefone

                        </label>

                        <input
                            type="text"
                            id="telefone"
                            placeholder="(33) 99999-9999"
                        >

                    </div>


                    <div class="campo">

                        <label for="whatsapp">

                            WhatsApp

                        </label>

                        <input
                            type="text"
                            id="whatsapp"
                            placeholder="(33) 99999-9999"
                        >

                    </div>

                </div>


                <!-- ==============================
                     DESCRIÇÃO
                =============================== -->

                <div class="campo">

                    <label for="descricao">

                        Descrição

                    </label>

                    <textarea
                        id="descricao"
                        rows="4"
                        placeholder="Descreva sua loja..."
                    ></textarea>

                </div>


                <!-- ==============================
                     ENDEREÇO
                =============================== -->

                <div class="campo">

                    <label for="endereco">

                        Endereço

                    </label>

                    <input
                        type="text"
                        id="endereco"
                        placeholder="Rua, número"
                    >

                </div>


                <!-- ==============================
                     CIDADE
                =============================== -->

                <div class="campo">

                    <label for="cidade">

                        Cidade

                    </label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Sua cidade"
                    >

                </div>


                <!-- ==============================
                     HORÁRIOS
                =============================== -->

                <div class="duas-colunas">


                    <div class="campo">

                        <label for="abertura">

                            Horário de abertura

                        </label>

                        <input
                            type="time"
                            id="abertura"
                        >

                    </div>


                    <div class="campo">

                        <label for="fechamento">

                            Horário de fechamento

                        </label>

                        <input
                            type="time"
                            id="fechamento"
                        >

                    </div>

                </div>


                <!-- ==============================
                     MENSAGEM
                =============================== -->

                <div
                    id="mensagem"
                    class="mensagem"
                ></div>


                <!-- ==============================
                     BOTÃO
                =============================== -->

                <button
                    type="submit"
                    class="btn"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    Cadastrar Loja

                </button>


            </form>

        </div>

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <p>

            © 2026 Comércio da Cidade -
            Todos os direitos reservados.

        </p>

    </footer>


    <!-- ==============================
         SCRIPTS
    =============================== -->

    <!-- SUPABASE -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- CONFIGURAÇÃO SUPABASE -->
    <script src="js/supabase.js"></script>


    <!-- HEADER -->
    <script src="components/header.js"></script>


    <!-- CADASTRO DA LOJA -->
    <script src="js/cadastrar-loja.js"></script>

</body>

</html>
