<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha | Comércio da Cidade</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="components/feedback.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <main class="container">
        <div class="login-card">
            <div class="logo">
                <i class="fa-solid fa-key"></i>

                <h1>Recuperar senha</h1>

                <p>
                    Informe o e-mail da sua conta. Enviaremos um link para você definir uma nova senha.
                </p>
            </div>

            <form id="recuperarSenhaForm">
                <div class="input-group">
                    <label for="email">E-mail</label>

                    <div class="input">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <button type="submit" id="btnRecuperar" class="btn-login">
                    <i class="fa-solid fa-paper-plane"></i>
                    Enviar link de recuperação
                </button>
            </form>

            <a href="login.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o login
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="components/feedback.js"></script>
    <script src="js/recuperar-senha.js"></script>
</body>

</html>
