<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Criar Conta | Comércio da Cidade
    </title>


    <!-- ==================================
         CSS DA PÁGINA
    =================================== -->

    <link
        rel="stylesheet"
        href="css/cadastro.css"
    >


    <!-- ==================================
         FEEDBACK / ALERTAS
    =================================== -->

    <link
        rel="stylesheet"
        href="components/feedback.css"
    >


    <!-- ==================================
         GOOGLE FONTS
    =================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================
         FONT AWESOME
    =================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>


<body>

    <main class="container">

        <div class="cadastro-card">


            <!-- ==================================
                 LOGO
            =================================== -->

            <div class="logo">

                <i class="fa-solid fa-store"></i>

                <h1>
                    Comércio da Cidade
                </h1>

                <p>
                    Crie sua conta gratuitamente.
                </p>

            </div>


            <!-- ==================================
                 FORMULÁRIO
            =================================== -->

            <form id="cadastroForm">


                <!-- NOME -->

                <div class="input-group">

                    <label for="nome">
                        Nome completo
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- TELEFONE -->

                <div class="input-group">

                    <label for="telefone">
                        Telefone
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="telefone"
                            placeholder="(00) 00000-0000"
                            autocomplete="tel"
                        >

                    </div>

                </div>


                <!-- SENHA -->

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                            minlength="8"
                            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                            title="Use pelo menos 8 caracteres, incluindo uma letra e um número."
                            required
                        >

                        <button
                            type="button"
                            id="toggleSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar ou ocultar senha"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                    <small class="senha-requisitos">
                        Use pelo menos 8 caracteres, incluindo uma letra e um número.
                    </small>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="input-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite novamente"
                            autocomplete="new-password"
                            minlength="8"
                            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                            title="Repita a senha com pelo menos 8 caracteres, uma letra e um número."
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmarSenha"
                            class="mostrar-senha"
                            aria-label="Mostrar ou ocultar confirmação da senha"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- TERMOS -->

                <div class="termos">

                    <label>

                        <input
                            type="checkbox"
                            id="termos"
                            required
                        >

                        Li e aceito os Termos de Uso
                        e a Política de Privacidade.

                    </label>

                </div>


                <!-- MENSAGEM DE CARREGAMENTO -->

                <div
                    id="mensagem"
                    aria-live="polite"
                ></div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="btn-cadastro"
                >

                    Criar Conta

                </button>

            </form>


            <!-- ==================================
                 LOGIN
            =================================== -->

            <div class="login">

                <p>
                    Já possui uma conta?
                </p>

                <a href="login.html">

                    Entrar

                </a>

            </div>


            <!-- ==================================
                 VOLTAR
            =================================== -->

            <a
                href="index.html"
                class="voltar"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Voltar para o início

            </a>

        </div>

    </main>


    <!-- ==================================
         SCRIPTS
    =================================== -->

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>

    <script src="js/supabase.js"></script>


    <!-- FEEDBACK PERSONALIZADO -->

    <script src="components/feedback.js"></script>


    <!-- CADASTRO -->

    <script src="js/cadastro.js"></script>

</body>

</html>
