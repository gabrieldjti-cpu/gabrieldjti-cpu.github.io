<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha | Comércio da Cidade</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="components/feedback.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <main class="container">
        <div class="login-card">
            <div class="logo">
                <i class="fa-solid fa-lock"></i>

                <h1>Definir nova senha</h1>

                <p>
                    Crie uma senha com pelo menos 8 caracteres, contendo letras e números.
                </p>
            </div>

            <form id="novaSenhaForm">
                <div class="input-group">
                    <label for="novaSenha">Nova senha</label>

                    <div class="input">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="novaSenha"
                            placeholder="Digite a nova senha"
                            autocomplete="new-password"
                            minlength="8"
                            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                            title="Use pelo menos 8 caracteres, incluindo uma letra e um número."
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-toggle-senha="novaSenha"
                            aria-label="Mostrar ou ocultar nova senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmarSenha">Confirmar nova senha</label>

                    <div class="input">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="8"
                            pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                            title="Repita a senha com pelo menos 8 caracteres, uma letra e um número."
                            required
                        >

                        <button
                            type="button"
                            class="mostrar-senha"
                            data-toggle-senha="confirmarSenha"
                            aria-label="Mostrar ou ocultar confirmação da senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnNovaSenha" class="btn-login" disabled>
                    <i class="fa-solid fa-floppy-disk"></i>
                    Salvar nova senha
                </button>
            </form>

            <a href="login.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i>
                Voltar para o login
            </a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
    <script src="js/supabase.js"></script>
    <script src="components/feedback.js"></script>
    <script src="js/nova-senha.js"></script>
</body>

</html>
