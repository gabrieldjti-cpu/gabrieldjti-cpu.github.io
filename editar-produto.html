<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Editar anúncio | Comércio da Cidade
  </title>


  <!-- ==================================
       CSS
  =================================== -->

  <link
    rel="stylesheet"
    href="components/header.css"
  />

  <link
    rel="stylesheet"
    href="components/feedback.css"
  />

  <link
    rel="stylesheet"
    href="css/novo-produto.css"
  />


  <!-- ==================================
       GOOGLE FONTS
  =================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />


  <!-- ==================================
       FONT AWESOME
  =================================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

<link rel="stylesheet" href="css/anuncio-fotos.css">
<link rel="stylesheet" href="css/dark-mode.css">
</head>


<body>


  <!-- ==================================
       HEADER
  =================================== -->

  <div id="header"></div>


  <!-- ==================================
       CONTEÚDO
  =================================== -->

  <main class="container">


    <!-- BREADCRUMB -->

    <div class="breadcrumb">

      <a href="painel-loja.html">
        Painel
      </a>

      >

      <a href="produtos.html">
        Meus anúncios
      </a>

      >

      <strong>
        Editar anúncio
      </strong>

    </div>


    <!-- ==================================
         CARD
    =================================== -->

    <section class="card">


      <!-- TÍTULO -->

      <h1 id="tituloPagina">

        <i class="fa-solid fa-pen"></i>

        Editar anúncio

      </h1>


      <!-- ==================================
           FORMULÁRIO
      =================================== -->

      <form id="form-produto">


        <div class="grid">


          <!-- ==================================
               COLUNA ESQUERDA
          =================================== -->

          <div class="col-esquerda">


            <!-- NOME -->

            <div class="campo">

              <label for="nome">
                Título do anúncio
              </label>

              <input
                type="text"
                id="nome"
                autocomplete="off"
                placeholder="Ex.: Bolo de Chocolate"
                required
              />

            </div>


            <!-- DESCRIÇÃO -->

            <div class="campo">

              <label for="descricao">
                Descrição
              </label>

              <textarea
                id="descricao"
                rows="5"
                maxlength="500"
                placeholder="Conte como está, o que acompanha, onde retirar..."
              ></textarea>

            </div>


            <!-- CATEGORIA / SUBCATEGORIA -->

            <div class="linha">


              <div class="campo">

                <label for="categoria">
                  Categoria
                </label>

                <select
                  id="categoria"
                  required
                >

                  <option value="">
                    Carregando...
                  </option>

                </select>

              </div>


              <div class="campo">

                <label for="subcategoria">
                  Subcategoria
                </label>

                <select
                  id="subcategoria"
                  disabled
                >

                  <option value="">
                    Selecione primeiro uma categoria
                  </option>

                </select>

              </div>

            </div>


            <!-- PREÇO / PROMOÇÃO -->

            <div class="linha">


              <div class="campo">

                <label for="preco">
                  Preço
                </label>

                <input
                  type="number"
                  id="preco"
                  step="0.01"
                  min="0.01"
                  inputmode="decimal"
                  placeholder="0,00"
                  required
                />

              </div>

              <div class="campo">

                <label for="preco-promocao">
                  Preço Promocional
                </label>

                <input
                  type="number"
                  id="preco-promocao"
                  step="0.01"
                  min="0.01"
                  inputmode="decimal"
                  placeholder="Opcional"
                />

              </div>

            </div>


            <!-- CONDIÇÃO (só nas categorias em que faz sentido) -->

            <div class="campo" id="campo-condicao" hidden>

                <label for="condicao">
                  Condição
                </label>

                <select id="condicao">
                  <option value="">Selecione</option>
                  <option value="novo">Novo</option>
                  <option value="usado">Usado</option>
                </select>

            </div>


            <!-- DISPONIBILIDADE -->

            <div class="campo">

                <label for="disponibilidade">
                  Disponibilidade
                </label>

                <select id="disponibilidade">
                  <option value="1">Disponível</option>
                  <option value="0">Indisponível</option>
                </select>

                <input type="hidden" id="estoque" value="1" />

            </div>


            <!-- BAIRRO (opcional) -->

            <div class="campo">

                <label for="bairro">
                  Bairro <small class="campo-opcional">(opcional)</small>
                </label>

                <input
                  type="text"
                  id="bairro"
                  maxlength="60"
                  autocomplete="address-level3"
                  placeholder="Ex.: Centro"
                />

                <small>
                  Ajuda quem procura perto de casa. Pode deixar em branco.
                </small>

            </div>


            <!-- PRODUTO ATIVO -->

            <div class="campo">

              <label>

                <input
                  type="checkbox"
                  id="ativo"
                />

                Anúncio ativo

              </label>

            </div>

          </div>


          <!-- ==================================
               COLUNA DIREITA
          =================================== -->

          <div class="col-direita">


            <!-- PREVIEW -->

            <div class="preview">

              <img
                id="preview"
                alt="Prévia da foto principal"
                style="display: none;"
              />

            </div>


            <!-- IMAGEM -->

            <div class="campo">

              <label for="imagem">

                <i class="fa-solid fa-image"></i>

                Trocar foto principal

              </label>

              <input
                type="file"
                id="imagem"
                accept="image/jpeg,image/png,image/webp"
              />

              <small>
                Formatos aceitos: JPG, PNG ou WEBP.
                Até 15 MB: a foto é diminuída automaticamente antes do envio.
              </small>

            </div>


            <!-- MAIS FOTOS (até 4, total de 5) -->

            <div class="campo campo-fotos-extras">

              <label for="fotosExtras">

                <i class="fa-solid fa-images"></i>

                Mais fotos

              </label>

              <input
                type="file"
                id="fotosExtras"
                accept="image/jpeg,image/png,image/webp"
                multiple
              />

              <small id="ajudaFotosExtras">
                Você pode colocar mais 4 fotos (até 5 no total, contando a principal).
              </small>

              <div id="listaFotosExtras" class="fotos-extras-lista" aria-live="polite"></div>

            </div>


            <!-- LOJA -->

            <div class="campo">

              <label for="nomeLoja">
                Minha Loja
              </label>

              <input
                type="text"
                id="nomeLoja"
                readonly
              />

            </div>

          </div>

        </div>


        <!-- ==================================
             BOTÕES
        =================================== -->

        <div class="botoes">


          <!-- CANCELAR -->

          <a
            href="produtos.html"
            class="btn-cancelar"
          >

            <i class="fa-solid fa-arrow-left"></i>

            Cancelar

          </a>


          <!-- SALVAR -->

          <button
            type="submit"
            id="btnSalvar"
            class="btn-salvar"
          >

            <i class="fa-solid fa-floppy-disk"></i>

            Salvar Alterações

          </button>

        </div>

      </form>

    </section>

  </main>


  <!-- ==================================
       SCRIPTS
  =================================== -->


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>


  <!-- CONFIGURAÇÃO SUPABASE -->

  <script src="js/supabase.js"></script>
  <script src="js/perfil-pessoal.js"></script>


  <!-- HEADER -->

  <script src="components/header.js"></script>


  <!-- FEEDBACK PERSONALIZADO -->

  <script src="components/feedback.js"></script>


  <!-- EDITAR PRODUTO -->

  <script src="js/editar-produto.js"></script>
  <script src="js/comprimir-imagem.js"></script>
  <script src="js/anuncio-fotos.js"></script>
  <script src="js/anuncio-campos.js"></script>
  <script src="js/limite-anuncios.js"></script>


</body>

</html>
